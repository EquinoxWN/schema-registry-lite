[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-registry-lite"
version = "0.1.0"
description = "Stops a schema change from breaking every consumer of an event: a registry that rejects breaking changes and says exactly why."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Runtime: the Python standard library only (http.server, sqlite3, json).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
srl = "schema_registry_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "A"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]
"scripts/**" = ["S310"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "tests"
