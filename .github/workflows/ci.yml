name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # ruff, ruff format, mypy --strict, pytest (warnings are errors).
      - run: make ci
      - name: Known-vulnerability audit
        run: make audit
      - name: Demo over HTTP (prints a notice with the result)
        run: |
          set -o pipefail
          make demo | tee .tmp/demo.log
          echo "::notice title=registry demo::$(grep '^RESULT' .tmp/demo.log)"
